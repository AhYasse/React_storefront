<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 
      Content Security Policy (CSP)
      - Explicitly omits 'unsafe-eval' to block dynamic code execution (eval, new Function).
      - Restricts script, style, image, and connection sources to trusted domains.
      - 'unsafe-inline' is retained for script/style to support Vite HMR and Tailwind CSS in dev.
      (For strict production, consider using a Vite plugin like vite-plugin-csp to inject nonces).
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://*.sentry.io;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: https:;
      connect-src 'self' http://localhost:5000 https://api.example.com https://*.sentry.io;
      font-src 'self' https://fonts.gstatic.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
    " />
    
    <title>ShopHub - eCommerce Store</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
